name: CI

# Builds every native SDK on every sync, and cuts a GitHub Release for tags.
# This file is generated from the Armenus monorepo (scripts/public-sdk/ci.yml).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build and test the core on macOS
        run: |
          swift build
          swift test
      - name: Compile the iOS module for the simulator
        run: xcodebuild -scheme Armenus -destination 'generic/platform=iOS Simulator' -quiet build

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Build the library and run its unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :armenus:assembleRelease :armenus:testReleaseUnitTest
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: armenus-aar
          path: android/build/outputs/aar/*.aar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [swift, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: armenus-aar
          path: aar
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; uploading assets only."
            gh release upload "$tag" aar/*.aar --clobber
            exit 0
          fi
          cat > notes.md <<EOF
          Armenus SDKs ${version}.

          - iOS (Swift Package Manager): \`.package(url: "https://github.com/armenusapp/sdk.git", from: "${version}")\`
          - Android (JitPack): \`implementation("com.github.armenusapp:sdk:${tag}")\`; the AAR is attached below.
          - Web and React Native: \`@armenus/sdk-core\`, \`@armenus/sdk-react\` and \`@armenus/sdk-react-native\` on npm.
          - Flutter: git dependency on this repository with \`path: flutter\`.

          Documentation: https://armenus.app/docs
          EOF
          gh release create "$tag" aar/*.aar --title "$tag" --notes-file notes.md
